#se configura la conexion a la base de datos

spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/venta_entradas_db}
    driverClassName: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  flyway:
    enabled: true
    locations: classpath:db/migration
    ignore-missing-migrations: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: "smtp.gmail.com"

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration: 900000 # 15 minutos en milisegundos
  refresh-expiration: 604800000 # 7 dias en milisegundos

cloudinary:
  cloud_name: ${CLOUDINARY_CLOUD_NAME}
  api_key: ${CLOUDINARY_API_KEY}
  api_secret: ${CLOUDINARY_API_SECRET}

mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  backend-url: ${APP_BACKEND_URL:https://ventaentradaappjava-back.onrender.com}
  


logging:
  level:
    root: INFO
    com.example.venta_entrada: INFO
    org.springframework.security: WARN
