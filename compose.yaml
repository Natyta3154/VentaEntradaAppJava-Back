services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: venta-entradas-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - DB_URL=jdbc:mysql://mysql_db:3306/${DB_NAME:-venta_entradas_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - PORT=8080
    depends_on:
      mysql_db:
        condition: service_healthy
    networks:
      - backend_net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          memory: 512M

  mysql_db:
    image: mysql:8.0-bookworm
    container_name: venta-entradas-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-venta_entradas_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - backend_net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  mysql_data:
    driver: local

networks:
  backend_net:
    driver: bridge
